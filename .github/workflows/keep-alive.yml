name: Keep Alive

# GitHub Actions automatically disables scheduled workflows after 60 days without repository activity.
# This workflow runs periodically and re-enables disabled workflows through the GitHub API.
# Reference: https://gooner.hateblo.jp/entry/2025/02/27/163322
#
# Note: workflow runs themselves do not count as repository activity.
# If this workflow itself is not run for 60 days, it is disabled and cannot restart itself (bootstrap problem).
# excavator.yml commits regularly, so this is normally not a problem in this repository.

on:
  schedule:
    # Run at 00:00 UTC on the 1st of every month
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    name: Keep Alive
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Re-enable workflows disabled due to inactivity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows" \
            --paginate \
            --jq '.workflows[] | select(.state == "disabled_inactivity") | .id' \
          | while read -r workflow_id; do
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/${workflow_id}/enable"
            echo "Enabled workflow ID: ${workflow_id}"
          done
